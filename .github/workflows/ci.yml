name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proto:
    name: proto (lint + breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # buf breaking needs history to diff against
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        run: buf lint
        working-directory: proto
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        # subdir=proto: the buf module is the proto/ subdirectory of this
        # repo, not the repo root, so the historical ref must be scoped the
        # same way or buf compares against the wrong tree entirely.
        run: buf breaking --against '../.git#branch=main,subdir=proto'
        working-directory: proto

  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [control-plane, sut]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: bufbuild/buf-setup-action@v1
        if: matrix.module == 'control-plane'
      - name: generate protobuf code
        # control-plane/gen/ is gitignored (generated, not committed) -- a
        # fresh checkout has no gen/ directory at all, so this MUST run
        # before `go build` or every control-plane build fails immediately.
        # sut has no proto dependency; skipped there.
        if: matrix.module == 'control-plane'
        run: buf generate
      - name: build
        run: go build ./...
        working-directory: ${{ matrix.module }}
      - name: vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}
      - name: test
        run: go test ./... -v
        working-directory: ${{ matrix.module }}

  python:
    name: python (brain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}

      - name: generate protobuf code
        # buf.gen.yaml's plugins are all `remote:` -- buf.build compiles
        # server-side, so no local Go toolchain is needed here even though
        # this same config also emits the Go side (which the `go` job
        # regenerates for itself; harmless, unused overhead in this job).
        run: buf generate

      - name: install python dependencies
        working-directory: brain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: wire up the ariadne namespace package (see brain/README.md)
        run: |
          SITE_PKGS=$(python -c "import site; print(site.getsitepackages()[0])")
          printf '%s\n%s\n' "$GITHUB_WORKSPACE/brain" "$GITHUB_WORKSPACE/brain/pb" > "$SITE_PKGS/ariadne-dev.pth"

      - name: install playwright chromium + system deps
        working-directory: brain
        run: playwright install --with-deps chromium

      - name: ruff
        working-directory: brain
        run: ruff check .

      - name: pytest
        working-directory: brain
        run: python -m pytest tests/ -v

  docker-build:
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - {name: web-ui, dockerfile: sut/services/web-ui/Dockerfile}
          - {name: search-api, dockerfile: sut/services/search-api/Dockerfile}
          - {name: pricing-svc, dockerfile: sut/services/pricing-svc/Dockerfile}
          - {name: booking-api, dockerfile: sut/services/booking-api/Dockerfile}
          - {name: payment-svc, dockerfile: sut/services/payment-svc/Dockerfile}
          - {name: sensor, dockerfile: control-plane/Dockerfile.sensor}
          - {name: logcollector, dockerfile: control-plane/Dockerfile.logcollector}
          - {name: orchestrator, dockerfile: control-plane/Dockerfile.orchestrator}
          - {name: netprobe, dockerfile: control-plane/Dockerfile.netprobe}
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        if: startsWith(matrix.image.dockerfile, 'control-plane/')
      - name: generate protobuf code
        # The control-plane-based images' Dockerfiles COPY control-plane/ as
        # build context and compile it inside the image -- gen/ must exist
        # on disk before that COPY, same as the `go` job above.
        if: startsWith(matrix.image.dockerfile, 'control-plane/')
        run: buf generate
      - name: build (catches Dockerfile bit-rot; not pushed anywhere)
        run: docker build -f ${{ matrix.image.dockerfile }} -t ariadne/${{ matrix.image.name }}:ci .
