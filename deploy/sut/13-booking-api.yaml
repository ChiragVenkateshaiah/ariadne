apiVersion: v1
kind: ServiceAccount
metadata: {name: booking-api, namespace: travel}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api
  namespace: travel
spec:
  replicas: 1
  selector: {matchLabels: {app: booking-api}}
  template:
    metadata: {labels: {app: booking-api}}
    spec:
      serviceAccountName: booking-api
      containers:
        - name: booking-api
          image: ariadne/booking-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8083}]
          env:
            - {name: PORT, value: "8083"}
            - {name: PAYMENT_SVC_URL, value: "http://payment-svc:8084"}
            - name: DATABASE_URL
              value: "postgres://ariadne:ariadne@postgres:5432/ariadne?sslmode=disable"
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
          readinessProbe: {httpGet: {path: /health, port: 8083}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8083}, initialDelaySeconds: 8, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: booking-api, namespace: travel}
spec:
  selector: {app: booking-api}
  ports: [{port: 8083, targetPort: 8083}]
