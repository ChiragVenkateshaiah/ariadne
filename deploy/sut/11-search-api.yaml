apiVersion: v1
kind: ServiceAccount
metadata: {name: search-api, namespace: travel}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: travel
spec:
  replicas: 1
  selector: {matchLabels: {app: search-api}}
  template:
    metadata: {labels: {app: search-api}}
    spec:
      serviceAccountName: search-api
      containers:
        - name: search-api
          image: ariadne/search-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8081}]
          env:
            - {name: PORT, value: "8081"}
            - {name: PRICING_SVC_URL, value: "http://pricing-svc:8082"}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
          readinessProbe: {httpGet: {path: /health, port: 8081}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8081}, initialDelaySeconds: 5, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: search-api, namespace: travel}
spec:
  selector: {app: search-api}
  ports: [{port: 8081, targetPort: 8081}]
