apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: travel
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: travel
type: Opaque
stringData:
  POSTGRES_USER: ariadne
  POSTGRES_PASSWORD: ariadne
  POSTGRES_DB: ariadne
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: travel
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard   # kind's default local-path provisioner
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: travel
spec:
  replicas: 1
  strategy:
    type: Recreate   # single ReadWriteOnce volume; never run two postgres pods at once
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      serviceAccountName: postgres
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: {name: postgres-credentials}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata   # subPath avoids postgres complaining about lost+found in the raw mount
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "ariadne"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "ariadne"]}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: travel
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
      targetPort: 5432
