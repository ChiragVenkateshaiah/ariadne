apiVersion: v1
kind: ServiceAccount
metadata: {name: payment-svc, namespace: travel}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-svc
  namespace: travel
spec:
  replicas: 1
  selector: {matchLabels: {app: payment-svc}}
  template:
    metadata: {labels: {app: payment-svc}}
    spec:
      serviceAccountName: payment-svc
      containers:
        - name: payment-svc
          image: ariadne/payment-svc:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8084}]
          env:
            - {name: PORT, value: "8084"}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
          readinessProbe: {httpGet: {path: /health, port: 8084}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8084}, initialDelaySeconds: 5, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: payment-svc, namespace: travel}
spec:
  selector: {app: payment-svc}
  ports: [{port: 8084, targetPort: 8084}]
