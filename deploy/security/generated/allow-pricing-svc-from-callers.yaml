# pricing-svc is reachable from search-api (each has a CALLS edge to it in the World Model) and from nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pricing-svc-from-callers
  namespace: travel
  labels:
    ariadne.dev/generated: 'true'
spec:
  podSelector:
    matchLabels:
      app: pricing-svc
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: search-api
