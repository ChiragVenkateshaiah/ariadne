apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: ariadne-system
---
# The orchestrator manages Jobs/Pods in the SUT's own namespace (where
# validators actually run), not cluster-wide -- a Role scoped to "travel",
# bound to a ServiceAccount from ariadne-system. This is itself a legitimate
# cross-namespace RoleBinding (the binding lives where the Role is; the
# subject can be a ServiceAccount from anywhere).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ariadne-orchestrator
  namespace: travel
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ariadne-orchestrator
  namespace: travel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ariadne-orchestrator
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: ariadne-system
