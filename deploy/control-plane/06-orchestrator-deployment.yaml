apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: ariadne-system
spec:
  replicas: 1
  selector: {matchLabels: {app: orchestrator}}
  template:
    metadata: {labels: {app: orchestrator}}
    spec:
      serviceAccountName: orchestrator
      containers:
        - name: orchestrator
          image: ariadne/orchestrator:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 9092, name: grpc}, {containerPort: 9102, name: metrics}]
          env:
            - {name: PORT, value: "9092"}
            - {name: DEFAULT_NAMESPACE, value: "travel"}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 128Mi}
          readinessProbe: {grpc: {port: 9092}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {grpc: {port: 9092}, initialDelaySeconds: 10, periodSeconds: 15}
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: ariadne-system
  labels: {app: orchestrator}  # see deploy/control-plane/02-sensor-deployment.yaml's comment
spec:
  selector: {app: orchestrator}
  ports:
    - {port: 9092, targetPort: 9092, name: grpc}
    - {port: 9102, targetPort: 9102, name: metrics}
